name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the leading v (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = "${{ github.ref_name }}".TrimStart("v")
          }
          if (-not $version) { throw "A version is required." }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build packages
        shell: pwsh
        run: ./build.ps1 -Version "${{ steps.version.outputs.value }}"

      - name: Verify checksums
        shell: pwsh
        run: |
          $lines = Get-Content artifacts/SHA256SUMS.txt
          foreach ($line in $lines) {
            $parts = $line -split "\s+", 2
            $expected = $parts[0]
            $name = $parts[1]
            $actual = (Get-FileHash "artifacts/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Checksum mismatch for $name" }
          }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag `
              "artifacts/FamilyTimeSaveManager-$version-portable-win-x64.zip" `
              "artifacts/FamilyTimeSaveManager-$version-setup-win-x64.exe" `
              "artifacts/SHA256SUMS.txt" --clobber
          } else {
            gh release create $tag `
              "artifacts/FamilyTimeSaveManager-$version-portable-win-x64.zip" `
              "artifacts/FamilyTimeSaveManager-$version-setup-win-x64.exe" `
              "artifacts/SHA256SUMS.txt" `
              --title "FamilyTime Save Manager $version" --generate-notes
          }
